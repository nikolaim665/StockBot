[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stockbot"
version = "0.1.0"
description = "Morning terminal summary of your Trading 212 + IBKR portfolios with news sentiment"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "rich>=13",
    "yfinance>=0.2.50",
    "vaderSentiment>=3.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
stockbot = "stockbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
